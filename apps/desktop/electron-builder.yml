appId: io.github.framewright.desktop
productName: Framewright
copyright: Copyright (c) 2026 Framewright contributors
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
publish: null
fileAssociations:
  - ext: fwplan
    name: Framewright Plan
    description: Framewright residential plan
    role: Editor
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [universal]
  category: public.app-category.graphics-design
  identity: null
  artifactName: ${productName}-${version}-universal.${ext}
dmg:
  writeUpdateInfo: false
